<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="473" viewBox="0 0 1260 473" role="img" aria-labelledby="title desc">
<title id="title">One-shot layer: ordinary typing example</title>
<desc id="desc">Read each row from left to right. Labels and colors identify the flow.</desc>
<rect width="1260" height="473" fill="white"/>
<g font-family="system-ui, sans-serif" fill="#172033">
<text x="24" y="38" font-size="24" font-weight="700">One-shot layer: ordinary typing example</text>
<text x="26" y="78" font-size="15" font-weight="600">From</text>
<text x="442" y="78" font-size="15" font-weight="600">Action</text>
<text x="858" y="78" font-size="15" font-weight="600">Result</text>
<rect x="24" y="94" width="380" height="100" rx="8" fill="#f1f5f9" stroke="#475569"/>
<text x="38" y="119" font-size="14">DEFAULT</text>
<text x="412" y="149" font-size="24">→</text>
<rect x="440" y="94" width="380" height="100" rx="8" fill="#fff4d6" stroke="#92400e"/>
<text x="454" y="119" font-size="14">Tap and release SYM</text>
<text x="828" y="149" font-size="24">→</text>
<rect x="856" y="94" width="380" height="100" rx="8" fill="#ede9fe" stroke="#5b21b6"/>
<text x="870" y="119" font-size="14">SYM waits for an eligible keycode or</text>
<text x="870" y="138" font-size="14">timeout</text>
<rect x="24" y="210" width="380" height="100" rx="8" fill="#f1f5f9" stroke="#475569"/>
<text x="38" y="235" font-size="14">SYM armed</text>
<text x="412" y="265" font-size="24">→</text>
<rect x="440" y="210" width="380" height="100" rx="8" fill="#fff4d6" stroke="#92400e"/>
<text x="454" y="235" font-size="14">Press physical W (currently digit 1)</text>
<text x="828" y="265" font-size="24">→</text>
<rect x="856" y="210" width="380" height="100" rx="8" fill="#ede9fe" stroke="#5b21b6"/>
<text x="870" y="235" font-size="14">Send 1; consume the one-shot layer</text>
<rect x="24" y="326" width="380" height="100" rx="8" fill="#f1f5f9" stroke="#475569"/>
<text x="38" y="351" font-size="14">DEFAULT exposed again</text>
<text x="412" y="381" font-size="24">→</text>
<rect x="440" y="326" width="380" height="100" rx="8" fill="#fff4d6" stroke="#92400e"/>
<text x="454" y="351" font-size="14">Release W, then press W again</text>
<text x="828" y="381" font-size="24">→</text>
<rect x="856" y="326" width="380" height="100" rx="8" fill="#ede9fe" stroke="#5b21b6"/>
<text x="870" y="351" font-size="14">Release 1; the new press sends w</text>
</g></svg>
